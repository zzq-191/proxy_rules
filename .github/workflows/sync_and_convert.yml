name: 每日同步并转换规则

# 定义触发条件
on:
  schedule:
    # 使用 cron 表达式，设置在每天的 UTC 时间 18:00 (北京时间凌晨 2:00) 运行
    - cron: '0 18 * * *'
  # 也允许手动触发
  workflow_dispatch:

jobs:
  sync-and-convert:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出你的代码到运行环境
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. 安装脚本依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 运行转换脚本
      - name: 运行转换脚本
        run: python convert.py

      # 5. 提交并推送更改
      - name: 提交并推送更改
        run: |
          # 配置 Git 用户信息
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 检查是否有文件被修改或新增
          if [[ -n "$(git status --porcelain)" ]]; then
            # 添加所有更改
            git add chinalist.txt
            # 提交更改
            git commit -m "chore: 自动更新 chinalist.txt $(date +'%Y-%m-%d %H:%M:%S')"
            # 推送到 GitHub
            git push
            echo "更改已推送到仓库。"
          else
            echo "没有检测到更改，无需提交。"
          fi
